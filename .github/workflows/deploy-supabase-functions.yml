name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - develop
      - master
      - deploy
      - Isaias
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FEEDBACK_TO_EMAIL: ${{ secrets.FEEDBACK_TO_EMAIL }}
      FEEDBACK_FROM_EMAIL: ${{ secrets.FEEDBACK_FROM_EMAIL }}
      APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
      CO_DEBTOR_FROM_EMAIL: ${{ secrets.CO_DEBTOR_FROM_EMAIL }}
      CO_DEBTOR_INVITATION_TTL_DAYS: ${{ secrets.CO_DEBTOR_INVITATION_TTL_DAYS }}
      HU18_CRON_SECRET: ${{ secrets.HU18_CRON_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_REF \
            RESEND_API_KEY \
            FEEDBACK_TO_EMAIL \
            FEEDBACK_FROM_EMAIL \
            APP_PUBLIC_URL \
            CO_DEBTOR_FROM_EMAIL \
            CO_DEBTOR_INVITATION_TTL_DAYS \
            HU18_CRON_SECRET
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::GitHub Secret ${secret_name} is not configured."
              missing=1
            fi
          done

          exit "$missing"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            RESEND_API_KEY="$RESEND_API_KEY" \
            FEEDBACK_TO_EMAIL="$FEEDBACK_TO_EMAIL" \
            FEEDBACK_FROM_EMAIL="$FEEDBACK_FROM_EMAIL" \
            APP_PUBLIC_URL="$APP_PUBLIC_URL" \
            CO_DEBTOR_FROM_EMAIL="$CO_DEBTOR_FROM_EMAIL" \
            CO_DEBTOR_INVITATION_TTL_DAYS="$CO_DEBTOR_INVITATION_TTL_DAYS" \
            HU18_CRON_SECRET="$HU18_CRON_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy submit-feedback function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy submit-feedback --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy co-debtor-consent function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy co-debtor-consent --project-ref "$SUPABASE_PROJECT_REF"
