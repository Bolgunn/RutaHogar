name: Refresh BCCh market snapshot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The refresh path imports only Python's standard library; do not install
      # the application, test, or frontend dependency sets in this job.
      - name: Refresh persisted BCCh snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_market_snapshot.py
        working-directory: backend
        env:
          BCCH_API_KEY_TOKEN: ${{ secrets.BCCH_API_KEY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
